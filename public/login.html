<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Laundry Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent-from: #3B82F6;
            --accent-to: #10B981;
        }
        
        body {
            background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .input-field {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .input-field:focus {
            outline: none;
            border-color: var(--accent-from);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .input-field::placeholder {
            color: #9ca3af;
        }
        
        .btn-login {
            width: 100%;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            font-family: inherit;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            color: #dc2626;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            color: #16a34a;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: white;
            font-size: 28px;
            font-weight: bold;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
            font-size: 14px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 8px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent-from);
        }
        
        .checkbox-group label {
            color: #6b7280;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            gap: 12px;
            color: #d1d5db;
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        
        .social-login {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .social-btn {
            padding: 10px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .social-btn:hover {
            border-color: var(--accent-from);
            background: #f3f4f6;
        }
        
        .footer-link {
            color: var(--accent-from);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .footer-link:hover {
            color: var(--accent-to);
        }
        
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .btn-login.loading {
            opacity: 0.8;
        }
        
        .btn-login.loading .loading-spinner {
            display: block;
        }
        
        .btn-login.loading span {
            display: none;
        }
        
        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }
        
        .forgot-password a {
            color: var(--accent-from);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .forgot-password a:hover {
            color: var(--accent-to);
        }
        
        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 14px;
        }
        
        .signup-link a {
            color: var(--accent-from);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .signup-link a:hover {
            color: var(--accent-to);
        }
        
        .container-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        
        @media (max-width: 640px) {
            .container-wrapper {
                padding: 16px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .form-group {
                margin-bottom: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container-wrapper">
        <div class="glass rounded-xl p-8">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo-icon">🧺</div>
                <h1 class="text-2xl font-bold text-gray-900">Laundry Enterprise</h1>
                <p class="text-gray-600 text-sm mt-2">Sistem Manajemen Laundry Profesional</p>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm">
                <!-- Email Field -->
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="input-field"
                        placeholder="nama@perusahaan.com"
                        required
                    />
                    <div class="error-message" id="emailError"></div>
                </div>
                
                <!-- Password Field -->
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input-field"
                        placeholder="Masukkan password Anda"
                        required
                    />
                    <div class="error-message" id="passwordError"></div>
                </div>
                
                <!-- Remember Me & Forgot Password -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div class="checkbox-group" style="margin-bottom: 0;">
                        <input type="checkbox" id="rememberMe" name="rememberMe" />
                        <label for="rememberMe">Ingat saya</label>
                    </div>
                    <div class="forgot-password">
                        <a href="/forgot-password">Lupa password?</a>
                    </div>
                </div>
                
                <!-- General Error Message -->
                <div class="error-message" id="generalError"></div>
                <div class="success-message" id="successMessage"></div>
                
                <!-- Login Button -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span>Masuk ke Sistem</span>
                    <div class="loading-spinner"></div>
                </button>
                
                <!-- Divider -->
                <div class="divider">Atau</div>
                
                <!-- Social Login Options -->
                <div class="social-login">
                    <button type="button" class="social-btn" id="googleBtn" onclick="handleSocialLogin('google')">
                        <span style="font-size: 18px;">G</span> Google
                    </button>
                    <button type="button" class="social-btn" id="microsoftBtn" onclick="handleSocialLogin('microsoft')">
                        <span style="font-size: 18px;">⊞</span> Microsoft
                    </button>
                </div>
            </form>
            
            <!-- Signup Link -->
            <div class="signup-link">
                Belum punya akun? <a href="/signup">Daftar di sini</a>
            </div>
            
            <!-- Footer Info -->
            <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
                <p style="color: #9ca3af; font-size: 12px; margin-bottom: 8px;">
                    © 2026 Aplikasi Laundry Enterprise. Semua hak dilindungi.
                </p>
                <div style="display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;">
                    <a href="#" class="footer-link" style="font-size: 12px;">Kebijakan Privasi</a>
                    <a href="#" class="footer-link" style="font-size: 12px;">Syarat Layanan</a>
                    <a href="#" class="footer-link" style="font-size: 12px;">Hubungi Kami</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Form submission handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await handleLogin();
        });
        
        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const loginBtn = document.getElementById('loginBtn');
            const generalError = document.getElementById('generalError');
            const successMessage = document.getElementById('successMessage');
            
            // Reset messages
            generalError.classList.remove('show');
            successMessage.classList.remove('show');
            document.getElementById('emailError').classList.remove('show');
            document.getElementById('passwordError').classList.remove('show');
            
            // Validation
            let hasError = false;
            if (!email) {
                document.getElementById('emailError').textContent = 'Email wajib diisi';
                document.getElementById('emailError').classList.add('show');
                hasError = true;
            }
            if (!password) {
                document.getElementById('passwordError').textContent = 'Password wajib diisi';
                document.getElementById('passwordError').classList.add('show');
                hasError = true;
            }
            
            if (hasError) return;
            
            // Show loading state
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        rememberMe: rememberMe
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    generalError.textContent = data.message || 'Login gagal. Silakan periksa email dan password Anda.';
                    generalError.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.classList.remove('loading');
                    return;
                }
                
                // Success
                successMessage.textContent = 'Login berhasil! Mengalihkan...';
                successMessage.classList.add('show');
                
                // Store token
                if (data.token) {
                    localStorage.setItem('authToken', data.token);
                    if (rememberMe) {
                        localStorage.setItem('rememberEmail', email);
                    }
                }
                
                // Redirect after short delay
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                generalError.textContent = 'Terjadi kesalahan koneksi. Silakan coba lagi.';
                generalError.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
            }
        }
        
        // Social login handler
        function handleSocialLogin(provider) {
            const providers = {
                google: 'https://accounts.google.com/o/oauth2/v2/auth',
                microsoft: 'https://login.microsoftonline.com/common/oauth2/v2.0/authorize'
            };
            
            console.log('Social login dengan:', provider);
            // Redirect to social login endpoint
            window.location.href = `/api/auth/social/${provider}`;
        }
        
        // Auto-fill remembered email
        window.addEventListener('DOMContentLoaded', () => {
            const rememberedEmail = localStorage.getItem('rememberEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });
        
        // Enter key to submit
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
