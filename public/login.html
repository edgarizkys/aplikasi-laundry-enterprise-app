<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Laundry Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent-from: #6366F1;
            --accent-to: #06B6D4;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 24px;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            color: white;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }
        
        .logo-section h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .logo-section p {
            color: #cbd5e1;
            font-size: 14px;
        }
        
        .login-form {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        .form-group label {
            display: block;
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-group input::placeholder {
            color: #94a3b8;
        }
        
        .form-group input:focus {
            outline: none;
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--accent-from);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }
        
        .remember-forgot label {
            display: flex;
            align-items: center;
            color: #cbd5e1;
            cursor: pointer;
            margin: 0;
        }
        
        .remember-forgot input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
            accent-color: var(--accent-from);
        }
        
        .remember-forgot a {
            color: var(--accent-from);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .remember-forgot a:hover {
            color: var(--accent-to);
        }
        
        .btn-login {
            width: 100%;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #cbd5e1;
            font-size: 14px;
        }
        
        .signup-link a {
            color: var(--accent-from);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .signup-link a:hover {
            color: var(--accent-to);
        }
        
        .demo-credentials {
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 16px;
            border-radius: 8px;
            margin-top: 24px;
            font-size: 13px;
            color: #a5f3fc;
        }
        
        .demo-credentials h4 {
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--accent-to);
        }
        
        .demo-credentials p {
            margin: 4px 0;
            color: #cbd5e1;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .input-icon {
            position: relative;
        }
        
        .input-icon svg {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #94a3b8;
            pointer-events: none;
        }
        
        .input-icon input {
            padding-right: 40px;
        }
        
        @media (max-width: 640px) {
            .login-container {
                padding: 16px;
            }
            
            .login-form {
                padding: 24px;
            }
            
            .logo-section h1 {
                font-size: 24px;
            }
            
            .logo-icon {
                width: 64px;
                height: 64px;
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-icon">🧺</div>
            <h1>Laundry Enterprise</h1>
            <p>Sistem Manajemen Laundry Modern</p>
        </div>
        
        <!-- Login Form -->
        <form class="login-form" id="loginForm">
            <!-- Error Message -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- Success Message -->
            <div class="success-message" id="successMessage"></div>
            
            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email atau Username</label>
                <div class="input-icon">
                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Masukkan email atau username Anda"
                        required
                        autocomplete="username"
                    >
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
            </div>
            
            <!-- Password Field -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password Anda"
                        required
                        autocomplete="current-password"
                    >
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
            </div>
            
            <!-- Remember & Forgot -->
            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    Ingat saya
                </label>
                <a href="#" onclick="event.preventDefault(); handleForgotPassword();">Lupa Password?</a>
            </div>
            
            <!-- Login Button -->
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Masuk</span>
            </button>
            
            <!-- Demo Credentials -->
            <div class="demo-credentials">
                <h4>Demo Credentials</h4>
                <p><strong>Admin:</strong> admin@laundry.com / admin123</p>
                <p><strong>Staff:</strong> staff@laundry.com / staff123</p>
            </div>
        </form>
    </div>
    
    <script>
        // Configuration
        const API_BASE = '/api';
        const SESSION_KEY = 'laundry_session';
        const TOKEN_KEY = 'laundry_token';
        
        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadRememberedEmail();
            setupEventListeners();
            checkExistingSession();
        });
        
        // Setup Event Listeners
        function setupEventListeners() {
            loginForm.addEventListener('submit', handleLogin);
            emailInput.addEventListener('focus', () => clearMessages());
            passwordInput.addEventListener('focus', () => clearMessages());
        }
        
        // Check Existing Session
        function checkExistingSession() {
            const token = localStorage.getItem(TOKEN_KEY);
            if (token) {
                verifyToken(token);
            }
        }
        
        // Verify Token
        function verifyToken(token) {
            fetch(`${API_BASE}/auth/verify`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.user) {
                    redirectToDashboard();
                }
            })
            .catch(() => {
                localStorage.removeItem(TOKEN_KEY);
            });
        }
        
        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            clearMessages();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) {
                showError('Email/Username dan Password harus diisi');
                return;
            }
            
            setLoading(true);
            
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        tenant_id: 'default'
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Login gagal');
                }
                
                if (data.success && data.token) {
                    localStorage.setItem(TOKEN_KEY, data.token);
                    
                    if (data.user) {
                        localStorage.setItem(SESSION_KEY, JSON.stringify(data.user));
                    }
                    
                    if (rememberMeCheckbox.checked) {
                        localStorage.setItem('remembered_email', email);
                    } else {
                        localStorage.removeItem('remembered_email');
                    }
                    
                    showSuccess('Login berhasil! Mengalihkan...');
                    
                    setTimeout(() => {
                        redirectToDashboard();
                    }, 1000);
                } else {
                    throw new Error(data.message || 'Login gagal');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError(error.message || 'Terjadi kesalahan. Silakan coba lagi.');
            } finally {
                setLoading(false);
            }
        }
        
        // Load Remembered Email
        function loadRememberedEmail() {
            const rememberedEmail = localStorage.getItem('remembered_email');
            if (rememberedEmail) {
                emailInput.value = rememberedEmail;
                rememberMeCheckbox.checked = true;
            }
        }
        
        // Show Error Message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }
        
        // Show Success Message
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
        }
        
        // Clear Messages
        function clearMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }
        
        // Set Loading State
        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            if (isLoading) {
                btnText.innerHTML = '<span class="loading-spinner"></span>Memproses...';
            } else {
                btnText.textContent = 'Masuk';
            }
        }
        
        // Handle Forgot Password
        function handleForgotPassword() {
            const email = prompt('Masukkan email Anda untuk reset password:');
            if (email) {
                clearMessages();
                setLoading(true);
                
                fetch(`${API_BASE}/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        showSuccess('Instruksi reset password telah dikirim ke email Anda');
                    } else {
                        showError(data.message || 'Gagal mengirim instruksi reset');
                    }
                })
                .catch(err => {
                    showError('Terjadi kesalahan. Silakan coba lagi.');
                })
                .finally(() => setLoading(false));
            }
        }
        
        // Redirect to Dashboard
        function redirectToDashboard() {
            window.location.href = '/dashboard.html';
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement !== loginBtn) {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
