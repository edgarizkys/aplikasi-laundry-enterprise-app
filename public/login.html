<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Laundry Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent-from: #3B82F6;
            --accent-to: #10B981;
        }
        .gradient-bg {
            background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
        }
        .gradient-text {
            background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            border-color: #3B82F6;
        }
        .btn-gradient {
            background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        .btn-gradient:active {
            transform: translateY(0);
        }
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        .shape {
            position: absolute;
            opacity: 0.05;
        }
        .shape-1 {
            width: 400px;
            height: 400px;
            background: #3B82F6;
            border-radius: 50%;
            top: -100px;
            left: -100px;
            animation: float 20s infinite ease-in-out;
        }
        .shape-2 {
            width: 300px;
            height: 300px;
            background: #10B981;
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
            animation: float 25s infinite ease-in-out reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
        .error-shake {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .password-toggle {
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white min-h-screen flex items-center justify-center">
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="w-full max-w-md px-6 relative z-10">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 gradient-bg rounded-2xl mb-4 shadow-lg">
                <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold mb-2">Aplikasi Laundry Enterprise</h1>
            <p class="text-gray-400">Sistem Manajemen Laundry Terpadu</p>
        </div>

        <!-- Login Card -->
        <div class="glass rounded-2xl p-8 shadow-2xl">
            <form id="loginForm" class="space-y-5">
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-semibold text-gray-300 mb-2">
                        Email atau Username
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                            </svg>
                        </div>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="nama@laundry.com" 
                            required
                            class="input-focus w-full pl-12 pr-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:border-transparent outline-none text-white placeholder-gray-500 transition"
                        >
                    </div>
                    <span class="text-red-400 text-xs mt-1 hidden" id="emailError"></span>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-300 mb-2">
                        Kata Sandi
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="••••••••" 
                            required
                            class="input-focus w-full pl-12 pr-12 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:border-transparent outline-none text-white placeholder-gray-500 transition"
                        >
                        <button 
                            type="button"
                            id="togglePassword"
                            class="password-toggle absolute inset-y-0 right-0 pr-4 flex items-center"
                            aria-label="Toggle password visibility"
                        >
                            <svg class="w-5 h-5 text-gray-400 hover:text-gray-200" id="eyeIcon" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M15.584 10.007L17.592 8c2.546 2.554 4.411 5.716 4.411 9.993 0 8.284-6.716 15-15 15C5.716 33 0 26.284 0 18c0-4.277 1.865-7.439 4.411-9.993L6.42 10.006C4.248 11.856 2.837 14.685 2.837 18c0 6.627 5.373 12 12 12s12-5.373 12-12c0-3.315-1.411-6.144-3.584-7.993h.347zm.563-2.57L12 10.985 7.852 6.837c3.037-1.855 6.27-1.855 9.209 0l.086.6z"/>
                            </svg>
                        </button>
                    </div>
                    <span class="text-red-400 text-xs mt-1 hidden" id="passwordError"></span>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input 
                            type="checkbox" 
                            id="rememberMe" 
                            name="rememberMe" 
                            class="w-4 h-4 rounded border-gray-600 text-blue-500 focus:ring-offset-gray-800 focus:ring-2 cursor-pointer"
                        >
                        <span class="ml-2 text-sm text-gray-400 cursor-pointer">Ingat saya</span>
                    </label>
                    <a href="#" class="text-sm text-blue-400 hover:text-blue-300 transition">
                        Lupa kata sandi?
                    </a>
                </div>

                <!-- Login Button -->
                <button 
                    type="submit" 
                    id="loginBtn"
                    class="btn-gradient w-full py-3 rounded-lg font-semibold text-white mb-2 flex items-center justify-center gap-2"
                >
                    <span id="btnText">Masuk</span>
                    <svg id="btnLoader" class="w-5 h-5 hidden animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>

                <!-- Error Alert -->
                <div id="errorAlert" class="hidden bg-red-500 bg-opacity-10 border border-red-500 text-red-200 px-4 py-3 rounded-lg text-sm flex items-start gap-3">
                    <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"/>
                    </svg>
                    <span id="errorMessage"></span>
                </div>

                <!-- Success Alert -->
                <div id="successAlert" class="hidden bg-green-500 bg-opacity-10 border border-green-500 text-green-200 px-4 py-3 rounded-lg text-sm flex items-start gap-3">
                    <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"/>
                    </svg>
                    <span id="successMessage"></span>
                </div>
            </form>

            <!-- Demo Credentials Hint -->
            <div class="mt-6 pt-6 border-t border-gray-600">
                <p class="text-xs text-gray-400 text-center mb-3">Demo Credentials:</p>
                <div class="space-y-2 text-xs">
                    <div class="bg-gray-800 rounded p-2 font-mono">
                        <div class="text-gray-300">Email: <span class="text-blue-300">admin@laundry.com</span></div>
                        <div class="text-gray-300">Pass: <span class="text-blue-300">password123</span></div>
                    </div>
                    <div class="bg-gray-800 rounded p-2 font-mono">
                        <div class="text-gray-300">Email: <span class="text-green-300">staff@laundry.com</span></div>
                        <div class="text-gray-300">Pass: <span class="text-green-300">password123</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8">
            <p class="text-gray-400 text-sm">
                © 2026 Aplikasi Laundry Enterprise. All rights reserved.
            </p>
        </div>
    </div>

    <script>
        // Password Toggle
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.style.opacity = type === 'text' ? '1' : '0.6';
        });

        // Form Submission
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.classList.add('hidden');
            successAlert.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // Client-side validation
            if (!email || !password) {
                showError('Email dan kata sandi harus diisi');
                loginForm.classList.add('error-shake');
                setTimeout(() => loginForm.classList.remove('error-shake'), 500);
                return;
            }

            if (password.length < 6) {
                showError('Kata sandi minimal 6 karakter');
                return;
            }

            // Loading state
            loginBtn.disabled = true;
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email,
                        password,
                        rememberMe
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Login gagal. Silakan coba lagi.');
                }

                // Success
                showSuccess('Login berhasil! Mengalihkan...');
                setTimeout(() => {
                    if (data.redirectUrl) {
                        window.location.href = data.redirectUrl;
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                }, 1500);

            } catch (error) {
                showError(error.message || 'Terjadi kesalahan. Silakan coba lagi.');
                loginForm.classList.add('error-shake');
                setTimeout(() => loginForm.classList.remove('error-shake'), 500);
            } finally {
                loginBtn.disabled = false;
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorAlert.classList.remove('hidden');
            successAlert.classList.add('hidden');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successAlert.classList.remove('hidden');
            errorAlert.classList.add('hidden');
        }

        // Demo credentials auto-fill (for testing)
        const demoButtons = document.querySelectorAll('.font-mono');
        demoButtons.forEach((btn, index) => {
            btn.style.cursor = 'pointer';
            btn.addEventListener('click', () => {
                if (index === 0) {
                    document.getElementById('email').value = 'admin@laundry.com';
                    document.getElementById('password').value = 'password123';
                } else {
                    document.getElementById('email').value = 'staff@laundry.com';
                    document.getElementById('password').value = 'password123';
                }
            });
        });

        // Enter key submit
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
